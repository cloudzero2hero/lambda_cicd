AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 Bucket for CICD PR'

Parameters:
  Environment: 
    Type: String
    Default: test
    AllowedValues: 
      - test
      - staging
      - production

Resources:
  S3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Sub 'cea-${AWS::StackName}-${Environment}-bucket'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: GitHubActionsTesting

Outputs:
  BucketName:
    Description: 'Name of created s3 bucket'
    Value: !Ref S3Bucket